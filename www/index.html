<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F1838">
<title>Castle Siege: History</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div id="stage">
  <!-- Simge sprite (ic-* ve i-* takma adlari): js/icons.js ekler, #stage icinde ilk cocuk (main.js prepare) -->
  <canvas id="game" class="hidden"></canvas>

  <!-- SAVAS ARAYUZU (720 genisliginde ortalanmis sutun) -->
  <div id="hud" class="hidden"><div class="col">
    <div id="hud-top">
      <button id="btn-pause" class="hbtn" aria-label="Duraklat">⏸</button>
      <button id="btn-speed" class="hbtn">x1</button>
      <button id="btn-auto" class="hbtn" data-i18n-title="Oto savaş" aria-label="Oto savaş">🤖</button>
      <div id="gold-chip"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-coin"/></svg></span><b id="gold-val">0</b><small id="gold-cap">/400</small><em id="gold-rate">+10/sn</em></div>
      <button id="btn-mine"><span class="ico">⛏</span><span id="mine-txt">Maden</span></button>
    </div>
    <div id="hud-info"><div id="info-title"></div><div id="info-chips"><span id="obj-chip" class="hidden"></span><span id="rule-chip" class="hidden"></span><span id="combo-chip" class="hidden"></span></div></div>
    <div id="perk-row"></div>
    <div id="hint" class="hidden"></div>
    <div id="hud-bottom">
      <div id="hud-row1">
        <div id="field-bar" class="hidden">
          <button id="fb-auto" class="fbtn">🎲<small data-i18n>Otomatik</small></button>
          <button id="fb-clear" class="fbtn">🗑<small data-i18n>Temizle</small></button>
          <button id="fb-go" class="fbtn go">⚔<small data-i18n>SAVAŞ</small></button>
          <button id="fb-stance" class="fbtn stance hidden">⚔<small data-i18n>Saldır</small></button>
        </div>
        <button id="btn-skill" class="card skill"><div class="cd"></div><div class="c-ico" id="skill-ico"></div><div class="s-txt"><div class="c-name" id="skill-name"></div><div class="c-cost" id="skill-state"></div></div></button>
      </div>
      <div id="cards"></div>
    </div>
  </div></div>

  <!-- ANA MENU (canli savas arkada) -->
  <div id="home" class="hidden"><div id="home-col">
    <div id="home-cur"><button id="home-settings" class="round" data-home="settings" aria-label="Ayarlar"><svg class="i" aria-hidden="true"><use href="#i-gear"/></svg></button><div class="spacer"></div><div class="curr"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-coin"/></svg></span><b id="home-coins">0</b></div><button class="curr plus" data-home="shop"><span class="ico gem"><svg class="i" aria-hidden="true"><use href="#i-gem"/></svg></span><b id="home-gems">0</b><i>+</i></button></div>
    <div id="home-logo"><svg class="tug" viewBox="0 0 120 276" aria-hidden="true">
        <path class="pi" d="M60 55V274"/><path class="pole" d="M60 58V271"/>
        <g class="tails"><path class="t1" d="M19 88H45L43.5 152L42 224L32 204L21.5 225L20 152Z"/><path class="t5" d="M47 88H73L72 162L71 264L60 243L49 265L48 162Z"/><path class="t2" d="M75 88H101L100 152L98.5 224L88 204L78 226L76.5 152Z"/></g>
        <path class="pi" d="M15 82H105"/><path class="bar" d="M17 82H103"/><circle class="ball" cx="15" cy="82" r="6"/><circle class="ball" cx="105" cy="82" r="6"/>
        <path class="sock" d="M52 52H68L66 63H54Z"/><path class="head" d="M60 3C69 14 74 28 70 41C68 47 64 51 60 53C56 51 52 47 50 41C46 28 51 14 60 3Z"/></svg><div class="hl-text"><div class="hl-name">CASTLE SIEGE:<br>HISTORY</div><div class="band"></div><div class="hl-tag" data-i18n>Ordunu kur. Seferi kazan.</div></div></div>
    <div id="home-btns">
      <button class="hbig" data-home="play"><span id="hb-main">▶ SEFERE ÇIK</span><small id="hb-sub"></small></button>
      <div class="hrow"><button data-home="map"><svg class="i" aria-hidden="true"><use href="#i-map"/></svg><span data-i18n>Sefer Haritası</span></button><button data-home="army"><svg class="i" aria-hidden="true"><use href="#i-shield"/></svg><span data-i18n>Ordu</span></button></div>
      <div class="hrow"><button data-home="daily"><svg class="i" aria-hidden="true"><use href="#i-cal"/></svg><span data-i18n>Günlük Sefer</span></button><button data-home="endless"><svg class="i" aria-hidden="true"><use href="#i-inf"/></svg><span data-i18n>Sonsuz Kuşatma</span></button></div>
      <div class="hrow three"><button data-home="vault"><svg class="i" aria-hidden="true"><use href="#i-chest"/></svg><span data-i18n>Hazine</span></button><button data-home="shop" class="shopbtn"><svg class="i" aria-hidden="true"><use href="#i-bag"/></svg><span data-i18n>Mağaza</span></button><button data-home="quests"><svg class="i" aria-hidden="true"><use href="#i-scroll"/></svg><span data-i18n>Görevler</span></button></div>
    </div>
    <div id="home-ver"></div>
  </div></div>

  <!-- SEFER MERKEZI (harita / ordu / hazine / gorev) -->
  <div id="hub" class="hidden"><div id="hub-col">
    <div id="hub-top">
      <button id="btn-home" class="round" aria-label="Ana menü"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></button>
      <div class="logo">CASTLE SIEGE: HISTORY</div>
      <div class="spacer"></div>
      <div class="curr"><span class="ico"><svg class="i" aria-hidden="true"><use href="#i-coin"/></svg></span><b id="cur-coins">0</b></div>
      <div class="curr"><span class="ico gem"><svg class="i" aria-hidden="true"><use href="#i-gem"/></svg></span><b id="cur-gems">0</b></div>
      <button id="btn-settings" class="round" aria-label="Ayarlar"><svg class="i" aria-hidden="true"><use href="#i-gear"/></svg></button>
    </div>
    <main id="tab-content"></main>
    <div id="ad-banner" class="hidden"></div>
    <nav id="tabs">
      <button data-tab="map" class="tab"><span><svg class="i" aria-hidden="true"><use href="#i-sword"/></svg></span><em data-i18n>Sefer</em></button>
      <button data-tab="army" class="tab"><span><svg class="i" aria-hidden="true"><use href="#i-shield"/></svg></span><em data-i18n>Ordu</em></button>
      <button data-tab="shop" class="tab"><span><svg class="i" aria-hidden="true"><use href="#i-bag"/></svg></span><em data-i18n>Mağaza</em></button>
      <button data-tab="vault" class="tab"><span><svg class="i" aria-hidden="true"><use href="#i-chest"/></svg></span><em data-i18n>Hazine</em></button>
      <button data-tab="quests" class="tab"><span><svg class="i" aria-hidden="true"><use href="#i-scroll"/></svg></span><em data-i18n>Görev</em></button>
    </nav>
  </div></div>

  <div id="tut" class="hidden"><div id="tut-ring"></div><div id="tut-hand">👆</div>
    <div id="tut-bubble"><div id="tut-step"></div><div id="tut-text"></div><div id="tut-row"><button id="tut-skip" class="btn small" data-i18n>Öğreticiyi geç</button><button id="tut-ok" class="btn gold small">Tamam</button></div></div></div>
  <div id="modal-layer" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <div id="boot"><div class="logo big">CASTLE SIEGE: HISTORY</div><div class="boot-rule"></div><div class="sub" data-i18n>Yükleniyor…</div></div>
</div>
<script src="js/version.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/monetize-config.js"></script>
<script src="js/monetize.js"></script>
<script src="js/monetize-providers.js"></script>
<script src="js/audio.js"></script>
<script src="js/sim.js"></script>
<script src="js/field.js"></script>
<script src="js/art.js"></script>
<script src="js/render.js"></script>
<script src="js/scenery.js"></script>
<script src="js/fieldrender.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
