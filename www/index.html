<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Seferhan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" class="hidden"></canvas>

  <!-- SAVAS ARAYUZU (720 genisliginde ortalanmis sutun) -->
  <div id="hud" class="hidden"><div class="col">
    <div id="hud-top">
      <button id="btn-pause" class="hbtn" aria-label="Duraklat">⏸</button>
      <button id="btn-speed" class="hbtn">x1</button>
      <div id="gold-chip"><span class="ico">🪙</span><b id="gold-val">0</b><small id="gold-cap">/400</small><em id="gold-rate">+10/sn</em></div>
      <button id="btn-mine"><span class="ico">⛏</span><span id="mine-txt">Maden</span></button>
    </div>
    <div id="hud-info"><div id="info-title"></div><div id="info-chips"><span id="rule-chip" class="hidden"></span><span id="combo-chip" class="hidden"></span></div></div>
    <div id="perk-row"></div>
    <div id="hint" class="hidden"></div>
    <div id="hud-bottom">
      <div id="hud-row1">
        <div id="lane-pick" aria-label="Koridor seç">
          <button class="lane-btn" data-lane="0">▲<b>1</b></button>
          <button class="lane-btn" data-lane="1">▲<b>2</b></button>
          <button class="lane-btn" data-lane="2">▲<b>3</b></button>
        </div>
        <button id="btn-skill" class="card skill"><div class="cd"></div><div class="c-ico" id="skill-ico"></div><div class="s-txt"><div class="c-name" id="skill-name"></div><div class="c-cost" id="skill-state"></div></div></button>
      </div>
      <div id="cards"></div>
    </div>
  </div></div>

  <!-- ANA MENU -->
  <div id="hub" class="hidden"><div id="hub-col">
    <div id="hub-top">
      <div class="logo">SEFERHAN</div>
      <div class="spacer"></div>
      <div class="curr"><span class="ico">🪙</span><b id="cur-coins">0</b></div>
      <div class="curr"><span class="ico">💎</span><b id="cur-gems">0</b></div>
      <button id="btn-settings" class="round">⚙</button>
    </div>
    <main id="tab-content"></main>
    <nav id="tabs">
      <button data-tab="map" class="tab"><span>⚔️</span>Sefer</button>
      <button data-tab="army" class="tab"><span>🛡️</span>Ordu</button>
      <button data-tab="vault" class="tab"><span>💰</span>Hazine</button>
      <button data-tab="quests" class="tab"><span>📜</span>Görev</button>
    </nav>
  </div></div>

  <div id="modal-layer" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <div id="boot"><div class="logo big">SEFERHAN</div><div class="sub">Yükleniyor…</div></div>
</div>
<script src="js/version.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
