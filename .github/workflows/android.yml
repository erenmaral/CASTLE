name: Android APK + AAB

# Her push'ta (ve elle tetiklemede) imzali APK (yan yukleme) ve AAB (Google Play) uretir, Releases'e yukler.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bagimliliklari kur
        run: npm ci

      - name: Birim testleri
        run: |
          node tests/unit-features.js | tail -3
          node tests/unit-v06.js | tail -3
          node tests/unit-v08.js | tail -3
          node tests/unit-v09.js | tail -3
          node tests/unit-v10.js | tail -3
          node tests/unit-v11.js | tail -3
          node tests/fuzz-sim.js 120 1 | tail -2
          node scripts/i18n.js check

      - name: Oyun mantigi duman testi (denge botu - kale ve acik alan)
        run: |
          node tests/sim-balance.js 2 | tail -5
          LMAX=30 node tests/field-balance.js 2 | tail -4

      - name: Surum bilgisi
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "name=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          sed -i "s/Z.BUILD = 'dev'/Z.BUILD = '${{ github.run_number }}'/" www/js/version.js

      - name: Reklam kimlikleri (varsa)
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
        run: node scripts/play-config.js

      - name: Capacitor senkronizasyonu
        run: npx cap sync android

      - name: Android SDK bilesenleri
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Secret tanimli degilse imza anahtari ILK derlemede uretilir ve Actions onbellegine kaydedilir; sonraki derlemeler AYNI anahtari kullanir
      # (boylece yeni APK eskisinin uzerine kurulur). Kalici/garantili cozum icin README'deki "Imza anahtari" bolumundeki secret'lari tanimlayin.
      - name: Imza anahtari onbellegi
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kscache
          key: zafarion-keystore-v1

      - name: Imza anahtari
        env:
          KS_B64: ${{ secrets.ZAFARION_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ZAFARION_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/zafarion.keystore"
          CD="$RUNNER_TEMP/kscache"
          mkdir -p "$CD"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
            echo "Kalici anahtar (secret) kullaniliyor: guncellemeler eski surumun uzerine kurulur."
          elif [ -f "$CD/zafarion.keystore" ] && [ -f "$CD/pass.txt" ]; then
            cp "$CD/zafarion.keystore" "$KS"
            PASS=$(cat "$CD/pass.txt")
            echo "Onbellekteki imza anahtari kullaniliyor: guncellemeler eski surumun uzerine kurulur."
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -noprompt -keystore "$KS" -storetype PKCS12 -alias zafarion -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Sefer Vakti, O=Sefer Vakti, C=TR"
            cp "$KS" "$CD/zafarion.keystore"; echo "$PASS" > "$CD/pass.txt"
            echo "::notice::Yeni imza anahtari uretildi ve onbellege kaydedildi. Bu surumden SONRAKI surumler ayni anahtarla imzalanir ve ustune kurulur. (Eski bir surum kuruluysa bir kez silmek gerekir.)"
          fi
          echo "::add-mask::$PASS"
          {
            echo "ZAFARION_KEYSTORE_FILE=$KS"
            echo "ZAFARION_KEYSTORE_PASSWORD=$PASS"
            echo "ZAFARION_KEY_PASSWORD=$PASS"
            echo "ZAFARION_KEY_ALIAS=zafarion"
          } >> "$GITHUB_ENV"

      - name: APK ve AAB derle
        working-directory: android
        env:
          ZAFARION_VERSION_CODE: ${{ github.run_number }}
          ZAFARION_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Cikti adlarini duzenle
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/CastleSiegeHistory-${{ steps.ver.outputs.name }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/CastleSiegeHistory-${{ steps.ver.outputs.name }}.aab"
          ls -la dist
          # AAB'nin icinde beklenen paket adi ve surum kodu var mi (Play'e yuklemeden once son kontrol)
          unzip -p "dist/CastleSiegeHistory-${{ steps.ver.outputs.name }}.aab" base/manifest/AndroidManifest.xml | strings | grep -c "io.github.erenmaral.castlesiege" || true

      - uses: actions/upload-artifact@v4
        with:
          name: CastleSiegeHistory-${{ steps.ver.outputs.name }}
          path: |
            dist/*.apk
            dist/*.aab

      - name: GitHub Release olustur
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(git log -1 --pretty=%s)
          gh release create "build-${{ github.run_number }}" "dist/CastleSiegeHistory-${{ steps.ver.outputs.name }}.apk" "dist/CastleSiegeHistory-${{ steps.ver.outputs.name }}.aab" \
            --target "${{ github.sha }}" --prerelease \
            --title "Castle Siege: History ${{ steps.ver.outputs.name }}" \
            --notes "Otomatik derleme #${{ github.run_number }} — ${MSG}"
